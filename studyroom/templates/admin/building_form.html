{% extends 'base.html' %}{% block content %}<div class="auth-layout"><section class="auth-card"><div class="eyebrow"><span class="line"></span>{{ _('STAFF DASHBOARD','管理员工作台') }}</div><h1>{{ _('Add building','添加楼宇') }}</h1><p>{{ _('Add a building before creating rooms in it.','先添加楼宇，再在其中创建房间。') }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-field"><label for="building_name">{{ _('Building name','楼宇名称') }}</label><input id="building_name" name="name" maxlength="100" required value="{{ request.form.name or '' }}"></div><div class="form-field"><label for="code">{{ _('Short code','楼宇代码') }}</label><input id="code" name="code" maxlength="20" required value="{{ request.form.code or '' }}"></div><div class="button-row"><button class="button">{{ _('Add building','添加楼宇') }}</button><a class="button-link" href="{{ url_for('admin.dashboard') }}">{{ _('Back','返回') }}</a></div></form></section></div>{% endblock %}
