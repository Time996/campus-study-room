{% extends 'base.html' %}{% block content %}<div class="auth-layout"><section class="auth-card"><div class="eyebrow"><span class="line"></span>{{ _('JOIN NOOK','加入 NOOK') }}</div><h1>{{ _('Create an account','注册账号') }}</h1><p>{{ _('Register as a student to reserve study rooms.','注册学生账号后即可预约自习室。') }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-field"><label for="name">{{ _('Name','姓名') }}</label><input id="name" name="name" maxlength="100" minlength="2" required value="{{ request.form.name or '' }}"></div><div class="form-field"><label for="email">{{ _('Email','邮箱') }}</label><input id="email" type="email" name="email" maxlength="255" required value="{{ request.form.email or '' }}"></div><div class="form-field"><label for="password">{{ _('Password','密码') }}</label><input id="password" type="password" name="password" minlength="8" maxlength="128" autocomplete="new-password" required><small>{{ _('At least 8 characters','至少 8 个字符') }}</small></div><div class="form-field"><label for="confirm_password">{{ _('Confirm password','确认密码') }}</label><input id="confirm_password" type="password" name="confirm_password" minlength="8" maxlength="128" autocomplete="new-password" required></div><div class="button-row"><button class="button" type="submit">{{ _('Create account','创建账号') }}</button><a class="button-link" href="{{ url_for('auth.login') }}">{{ _('Already registered? Sign in','已有账号？登录') }}</a></div></form></section></div>{% endblock %}
