{% extends 'base.html' %}{% block content %}<div class="auth-layout"><section class="auth-card"><div class="eyebrow"><span class="line"></span>{{ _('WELCOME BACK','欢迎回来') }}</div><h1>{{ _('Sign in','登录') }}</h1><p>{{ _('Access your study room reservations.','登录后查看和管理你的预约。') }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_url }}"><div class="form-field"><label for="email">{{ _('Email','邮箱') }}</label><input id="email" type="email" name="email" maxlength="255" autocomplete="username" required value="{{ request.form.email or '' }}"></div><div class="form-field"><label for="password">{{ _('Password','密码') }}</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><div class="button-row"><button class="button" type="submit">{{ _('Sign in','登录') }} <svg><use href="#i-arrow"/></svg></button><a class="button-link" href="{{ url_for('auth.register') }}">{{ _('Create an account','注册账号') }}</a></div></form></section></div>{% endblock %}
